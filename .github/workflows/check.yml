name: Flake check

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Check formatting
        run: nix fmt -- --ci

      # Eval only — the full system closure is too heavy for GitHub runners
      # (garnix builds every checks.* on push).
      - name: Evaluate system
        run: nix flake check --no-build --all-systems

      # Cheap checks that do run code: Hyprland Lua, the generated.lua contract,
      # and the shell-settings merge.
      - name: Build lightweight checks
        run: >
          nix build
          .#checks.x86_64-linux.hyprland-lua
          .#checks.x86_64-linux.hyprland-contract
          .#checks.x86_64-linux.shell-settings
